server:
  # This application runs behind two proxies in the deployed environment: Cloudflare terminates
  # TLS for workeasy360.com, and Elastic Beanstalk's nginx forwards to the jar on port 5000.
  # Without this, the application believes its own address is the internal http://<host>:5000,
  # so it treats a SAME-ORIGIN browser request from https://ops.workeasy360.com as cross-origin
  # and rejects it with "Invalid CORS request". Browsers omit the Origin header on a same-origin
  # GET but always send it on POST/PATCH/DELETE, which is why reads succeeded while saves failed.
  #
  # `framework` installs Spring's ForwardedHeaderFilter, which rebuilds the request's scheme,
  # host and port from the X-Forwarded-* headers the proxies set. Same-origin requests are then
  # recognised as such and skip CORS entirely, and generated absolute URLs (the Location header
  # returned on 201 Created) point at the public address rather than the internal one.
  forward-headers-strategy: framework

  servlet:
    session:
      # The server-side session that "Sign in with Workeasy360" creates. Idle timeout: a person who is
      # away longer than this signs in again (access ending in Workeasy360 is enforced separately, by
      # the entitlement check, within 15 minutes).
      timeout: ${PROJECTMODULE_SESSION_IDLE_TIMEOUT:8h}
      tracking-modes: cookie
      cookie:
        # __Host- prefix (only valid with Secure, path / and no Domain): a sibling subdomain cannot plant or
        # overwrite it. The local profile (plain http) uses a plain name.
        name: ${PROJECTMODULE_SESSION_COOKIE_NAME:__Host-ep_session}
        http-only: true
        same-site: lax
        # Secure by default. Only the local profile (plain http on localhost) turns it off.
        secure: ${PROJECTMODULE_SESSION_COOKIE_SECURE:true}

spring:
  application:
    name: project-module

  # Attachments. Keep in step with AttachmentApplicationService.MAX_FILE_BYTES.
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

  # Email is optional. Set SPRING_MAIL_HOST (and SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD,
  # SPRING_MAIL_PORT) to turn it on; without a host the app sends nothing and works normally.

  datasource:
    # Credentials come from the environment only. Never commit a secret to this file.
    url: ${PROJECTMODULE_DB_URL}
    username: ${PROJECTMODULE_DB_USERNAME}
    password: ${PROJECTMODULE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway is the only schema authority. Hibernate never creates or alters a table.
      ddl-auto: validate
    # Off deliberately: Boot defaults this on, which hides lazy-loading and N+1 problems
    # behind the view layer.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # No business migrations exist yet; this is the location they will land in.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Never: health is a probe, not a status page for every signed-in customer.
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

projectmodule:
  # The public address, used for links in emails.
  app-base-url: ${PROJECTMODULE_APP_BASE_URL:https://ops.workeasy360.com}
  mail:
    from: ${PROJECTMODULE_MAIL_FROM:noreply@workeasy360.com}
  auth:
    # From Google Cloud. "Sign in with Google" appears only when this is set. Public, not a secret.
    google-client-id: ${PROJECTMODULE_GOOGLE_CLIENT_ID:}
    # Callers sign in with email and password (and present a session token) or with Workeasy360 (a
    # session cookie). Set this to true ONLY if a gateway sets X-User-Id and X-Org-Id and this service
    # cannot be reached except through it: otherwise anyone could claim to be anyone by sending those
    # headers.
    trust-identity-headers: ${PROJECTMODULE_AUTH_TRUST_IDENTITY_HEADERS:false}
  cors:
    # Comma-separated origins allowed to call /api/v1/** from a browser (see ApiConfiguration).
    #
    # The first two are the Vite dev/preview ports, for `npm run dev` against a local backend.
    # The two workeasy360.com origins are the deployed site. Those are listed here, rather than
    # left to an environment variable, so that a deployment needs no manual console step — an
    # origin is a public address, never a secret. The forward-headers setting above means a
    # browser on ops.workeasy360.com is normally recognised as same-origin and never consults
    # this list; it remains as the explicit allowance for a genuinely cross-origin caller, such
    # as the apex domain calling this API.
    #
    # Override with PROJECTMODULE_CORS_ALLOWED_ORIGINS to replace the whole list. Never use a
    # wildcard. Credentials are off, so a cross-origin page never carries the sign-in session.
    allowed-origins: ${PROJECTMODULE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,https://workeasy360.com,https://ops.workeasy360.com}

# Sign in with Workeasy360 (docs/workeasy360-sso.md), alongside email sign-in. Environment variables
# WORKEASY360_ISSUER, WORKEASY360_CLIENT_ID, WORKEASY360_REDIRECT_URI, WORKEASY360_KEY_ID,
# WORKEASY360_PRIVATE_KEY_FILE (or WORKEASY360_PRIVATE_KEY), WORKEASY360_PRODUCT_CODE,
# WORKEASY360_POST_LOGOUT_REDIRECT_URI and WORKEASY360_SIGN_IN_MODE bind to the properties below. Nothing
# about the provider is defaulted here on purpose: with none of the required ones Workeasy360 sign-in is
# off, and outside the local and test profiles the application refuses to start with only some of them.
workeasy360:
  product-code: easy_project
  # sso_optional: the sign-in page offers email sign-in and Workeasy360. sso_only: Workeasy360 is the only
  # way in (email sign-in endpoints refuse new sign-ins, and the app starts Workeasy360 sign-in by itself).
  sign-in-mode: sso_optional

logging:
  level:
    com.projectmodule: INFO
