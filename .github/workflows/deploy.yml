name: Deploy to AWS Elastic Beanstalk

# Every push to main is a production release. The environment is a single small instance in an
# account with an 8-vCPU limit, so the release updates that instance in place: no extra
# instances are launched, and no setting that would make Elastic Beanstalk replace the instance is
# changed (on 2026-11-11 changing the health reporting type did exactly that and took the site
# down). The app restarts once, for about one to two minutes.
#
#   1. All frontend and backend tests must pass (backend against a real PostgreSQL).
#   2. The environment must be Ready, and a database backup must exist (a snapshot, or RDS
#      automated backups that can restore to a time just before the release).
#   3. The bundle is deployed to the existing instance (deployment policy "AllAtOnce").
#   4. The new version is checked directly on the instance (not through Cloudflare). If that
#      check fails, the previous version is deployed back automatically.
# If any step fails before the deployment, nothing in AWS has changed.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  EB_APPLICATION: Project-Module
  EB_ENVIRONMENT: Project-Module-env

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: projectmodule_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests and type check
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc -b
          npx vitest run

      - name: Backend tests (real PostgreSQL)
        env:
          PROJECTMODULE_TEST_DB_URL: jdbc:postgresql://localhost:5432/projectmodule_test
          PROJECTMODULE_TEST_DB_USERNAME: postgres
          PROJECTMODULE_TEST_DB_PASSWORD: ci-only
        run: mvn -B -DskipFrontend=true test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-north-1
      VERSION_LABEL: v${{ github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Build
        run: mvn -B clean package -DskipTests

      - name: Assemble the deployment bundle
        run: |
          rm -rf bundle bundle.zip
          mkdir bundle
          cp target/project-module-0.0.1-SNAPSHOT.jar bundle/application.jar
          cp -r deploy/. bundle/
          (cd bundle && zip -qr ../bundle.zip .)
          unzip -l bundle.zip

      - name: Check the environment (read only)
        run: |
          set -euo pipefail
          read -r STATUS HEALTH CURRENT ENDPOINT <<<"$(aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION" --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].[Status,Health,VersionLabel,EndpointURL]' --output text)"
          echo "Environment status: $STATUS, health: $HEALTH, running: $CURRENT"
          if [ "$STATUS" != "Ready" ]; then
            echo "::error::The environment is busy ($STATUS). Nothing was changed. Run this workflow again when it is Ready."
            exit 1
          fi
          echo "PREVIOUS_VERSION=$CURRENT" >> "$GITHUB_ENV"
          echo "INSTANCE_URL=http://$ENDPOINT" >> "$GITHUB_ENV"
          setting() {
            aws elasticbeanstalk describe-configuration-settings \
              --application-name "$EB_APPLICATION" --environment-name "$EB_ENVIRONMENT" \
              --query "ConfigurationSettings[0].OptionSettings[?Namespace=='$1' && OptionName=='$2'].Value | [0]" --output text
          }
          echo "Environment type: $(setting aws:elasticbeanstalk:environment EnvironmentType)"
          echo "Deployment policy: $(setting aws:elasticbeanstalk:command DeploymentPolicy)"
          echo "Health reporting: $(setting aws:elasticbeanstalk:healthreporting:system SystemType)"
          DB_URL="$(setting aws:elasticbeanstalk:application:environment PROJECTMODULE_DB_URL)"
          if [ -z "$DB_URL" ] || [ "$DB_URL" = "None" ]; then
            DB_URL="$(setting aws:elasticbeanstalk:application:environment SPRING_DATASOURCE_URL)"
          fi
          echo "::add-mask::$DB_URL"
          DB_HOST="$(echo "$DB_URL" | sed -E 's#^jdbc:postgresql://([^:/]+).*#\1#')"
          echo "::add-mask::$DB_HOST"
          echo "DB_HOST=$DB_HOST" >> "$GITHUB_ENV"

      - name: Check the assistant key (never printed)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY secret: the assistant stays off."
            exit 0
          fi
          RAW="$ANTHROPIC_API_KEY"
          echo "Saved secret: ${#RAW} characters, contains sk-ant-: $(printf '%s' "$RAW" | grep -c 'sk-ant-' || true), non-ASCII characters: $(printf '%s' "$RAW" | LC_ALL=C tr -d '\0-\177' | wc -c), spaces or line breaks: $(printf '%s' "$RAW" | tr -cd ' \t\r\n' | wc -c)"
          # The same clean-up the app does: take the sk-ant- key out of whatever was pasted.
          KEY="$(printf '%s' "$RAW" | grep -oE 'sk-ant-[A-Za-z0-9_-]+' | head -1 || true)"
          if [ -z "$KEY" ]; then KEY="$(printf '%s' "$RAW" | tr -d '[:space:]')"; fi
          echo "::add-mask::$KEY"
          case "$KEY" in sk-ant-*) START="${KEY:0:11}" ;; *) START="(not an Anthropic key)" ;; esac
          echo "Key used: length ${#KEY}, starts with $START, capital letters: $(printf '%s' "$KEY" | tr -cd 'A-Z' | wc -c)"
          CODE="$(curl -s -o answer.json -w '%{http_code}' --max-time 60 https://api.anthropic.com/v1/messages \
            -H "x-api-key: $KEY" -H 'anthropic-version: 2023-06-01' -H 'content-type: application/json' \
            -d '{"model":"claude-opus-5-5","max_tokens":8,"messages":[{"role":"user","content":"hi"}]}')"
          echo "Anthropic answered HTTP $CODE: $(grep -oE '"type":"[a-z_]+"' answer.json | tail -1)"
          rm -f answer.json
          SERVER="$(aws elasticbeanstalk describe-configuration-settings \
            --application-name "$EB_APPLICATION" --environment-name "$EB_ENVIRONMENT" \
            --query "ConfigurationSettings[0].OptionSettings[?Namespace=='aws:elasticbeanstalk:application:environment' && OptionName=='ANTHROPIC_API_KEY'].Value | [0]" \
            --output text)"
          echo "::add-mask::$SERVER"
          if [ "$SERVER" = "$ANTHROPIC_API_KEY" ]; then echo "The server's key matches the GitHub secret."
          elif [ -z "$SERVER" ] || [ "$SERVER" = "None" ]; then echo "The server has no key yet."
          else echo "The server's key differs from the GitHub secret (length ${#SERVER}); this deploy replaces it."; fi
          if [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
            echo "::error::Anthropic does not accept the ANTHROPIC_API_KEY secret (HTTP $CODE). Nothing was deployed. Save the key again in GitHub, copied exactly."
            exit 1
          fi

      - name: Make sure a database backup exists
        run: |
          set -euo pipefail
          # Only harmless facts are printed: the repository is public, so its logs are too.
          if [ -z "$DB_HOST" ] || [ "$DB_HOST" = "None" ]; then
            echo "::error::The environment has no database address to find the database by. Nothing was changed."
            exit 1
          fi
          HOST="$(echo "$DB_HOST" | tr '[:upper:]' '[:lower:]')"
          DB_REGION="$(echo "$HOST" | sed -E 's#.*\.([a-z0-9-]+)\.rds\.amazonaws\.com$#\1#')"
          INSTANCE="$(aws rds describe-db-instances --region "$DB_REGION" \
            --query "DBInstances[?Endpoint.Address=='$HOST'].DBInstanceIdentifier | [0]" --output text)"
          if [ -z "$INSTANCE" ] || [ "$INSTANCE" = "None" ]; then
            echo "::error::Could not find the production database. Nothing was changed."
            exit 1
          fi
          STAMP="before-${{ github.run_number }}-${{ github.run_attempt }}-$(date -u +%Y%m%d%H%M)"
          if aws rds create-db-snapshot --region "$DB_REGION" --db-instance-identifier "$INSTANCE" \
              --db-snapshot-identifier "$STAMP" > /dev/null 2>&1; then
            aws rds wait db-snapshot-available --region "$DB_REGION" --db-snapshot-identifier "$STAMP"
            echo "Backup ready: snapshot $STAMP"
            exit 0
          fi
          echo "A manual snapshot is not allowed for the deploy credentials; checking RDS automated backups."
          read -r RETENTION RESTORABLE <<<"$(aws rds describe-db-instances --region "$DB_REGION" \
            --db-instance-identifier "$INSTANCE" \
            --query 'DBInstances[0].[BackupRetentionPeriod,LatestRestorableTime]' --output text)"
          AGE=$(( $(date -u +%s) - $(date -u -d "$RESTORABLE" +%s 2>/dev/null || echo 0) ))
          if [ "${RETENTION:-0}" -gt 0 ] && [ "$AGE" -lt 900 ]; then
            echo "Automated backups are on (kept $RETENTION days), restorable to $RESTORABLE."
            echo "To undo this release's data changes, restore to a point in time before $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            exit 0
          fi
          echo "::error::No database backup is available. Nothing was changed."
          exit 1

      - name: Deploy the new version to the existing instance
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          BUCKET="$(aws elasticbeanstalk create-storage-location --query S3Bucket --output text)"
          KEY="$EB_APPLICATION/$VERSION_LABEL.zip"
          aws s3 cp bundle.zip "s3://$BUCKET/$KEY" --only-show-errors
          aws elasticbeanstalk create-application-version --application-name "$EB_APPLICATION" \
            --version-label "$VERSION_LABEL" --source-bundle "S3Bucket=$BUCKET,S3Key=$KEY" \
            --description "${{ github.sha }}" --process > /dev/null
          for i in $(seq 1 30); do
            STATE="$(aws elasticbeanstalk describe-application-versions --application-name "$EB_APPLICATION" \
              --version-labels "$VERSION_LABEL" --query 'ApplicationVersions[0].Status' --output text)"
            [ "$STATE" = "PROCESSED" ] && break
            if [ "$STATE" = "FAILED" ]; then echo "::error::The bundle was rejected. Nothing was deployed."; exit 1; fi
            sleep 5
          done
          # Roll out in place on the existing instance. DeploymentPolicy only says how code is rolled
          # out; changing it does not replace the instance. It is set on its own first, so this
          # deployment is sure to use it.
          POLICY="$(aws elasticbeanstalk describe-configuration-settings \
            --application-name "$EB_APPLICATION" --environment-name "$EB_ENVIRONMENT" \
            --query "ConfigurationSettings[0].OptionSettings[?Namespace=='aws:elasticbeanstalk:command' && OptionName=='DeploymentPolicy'].Value | [0]" \
            --output text)"
          if [ "$POLICY" != "AllAtOnce" ]; then
            echo "Setting the deployment policy from $POLICY to AllAtOnce (no extra instances)"
            aws elasticbeanstalk update-environment --environment-name "$EB_ENVIRONMENT" \
              --option-settings Namespace=aws:elasticbeanstalk:command,OptionName=DeploymentPolicy,Value=AllAtOnce > /dev/null
            for i in $(seq 1 40); do
              STATUS="$(aws elasticbeanstalk describe-environments --environment-names "$EB_ENVIRONMENT" \
                --query 'Environments[0].Status' --output text)"
              [ "$STATUS" = "Ready" ] && break
              sleep 15
            done
          fi
          echo "DEPLOY_STARTED=true" >> "$GITHUB_ENV"
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            aws elasticbeanstalk update-environment --environment-name "$EB_ENVIRONMENT" --version-label "$VERSION_LABEL" \
              --option-settings "Namespace=aws:elasticbeanstalk:application:environment,OptionName=ANTHROPIC_API_KEY,Value=$ANTHROPIC_API_KEY" > /dev/null
          else
            aws elasticbeanstalk update-environment --environment-name "$EB_ENVIRONMENT" --version-label "$VERSION_LABEL" > /dev/null
          fi
          echo "Deploying $VERSION_LABEL to the existing instance."
          for i in $(seq 1 80); do
            read -r STATUS HEALTH RUNNING <<<"$(aws elasticbeanstalk describe-environments \
              --environment-names "$EB_ENVIRONMENT" --query 'Environments[0].[Status,Health,VersionLabel]' --output text)"
            echo "$(date -u +%H:%M:%S) status $STATUS, health $HEALTH, running $RUNNING"
            [ "$STATUS" = "Ready" ] && break
            sleep 15
          done
          aws elasticbeanstalk describe-events --environment-name "$EB_ENVIRONMENT" --max-items 12 \
            --query 'Events[].[EventDate,Severity,Message]' --output text || true
          if [ "$RUNNING" != "$VERSION_LABEL" ]; then
            echo "::error::Elastic Beanstalk did not switch to the new version."
            exit 1
          fi

      - name: Check the new version on the instance
        run: |
          set -euo pipefail
          echo "Checking $INSTANCE_URL"
          for i in $(seq 1 24); do
            if curl -fsS --max-time 10 "$INSTANCE_URL/actuator/health" | grep -q '"UP"' \
              && curl -fsS --max-time 10 "$INSTANCE_URL/" | grep -q '<title>WorkEasyProject</title>' \
              && curl -fsS --max-time 10 "$INSTANCE_URL/api/v1/auth/config" | grep -q 'legacyHandover'; then
              echo "The new version is running and healthy."
              exit 0
            fi
            sleep 15
          done
          echo "::error::The new version did not pass its checks."
          exit 1

      - name: Put the previous version back
        if: failure() && env.DEPLOY_STARTED == 'true' && env.PREVIOUS_VERSION != ''
        run: |
          RUNNING="$(aws elasticbeanstalk describe-environments --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].VersionLabel' --output text)"
          if [ "$RUNNING" = "$PREVIOUS_VERSION" ]; then
            echo "The previous version $PREVIOUS_VERSION is still running; nothing to put back."
            exit 0
          fi
          for i in $(seq 1 60); do
            STATUS="$(aws elasticbeanstalk describe-environments --environment-names "$EB_ENVIRONMENT" \
              --query 'Environments[0].Status' --output text)"
            [ "$STATUS" = "Ready" ] && break
            sleep 15
          done
          echo "Redeploying $PREVIOUS_VERSION"
          aws elasticbeanstalk update-environment --environment-name "$EB_ENVIRONMENT" --version-label "$PREVIOUS_VERSION" > /dev/null
          for i in $(seq 1 80); do
            STATUS="$(aws elasticbeanstalk describe-environments --environment-names "$EB_ENVIRONMENT" \
              --query 'Environments[0].Status' --output text)"
            [ "$STATUS" = "Ready" ] && break
            sleep 15
          done
          echo "Rolled back to $PREVIOUS_VERSION."
