name: Deploy to AWS Elastic Beanstalk

# Every push to main is a production release, so this workflow protects customers who are using
# the product while it runs:
#   1. All frontend and backend tests must pass (backend against a real PostgreSQL).
#   2. The environment must be healthy, and the production database is snapshotted before
#      anything changes.
#   3. The release is deployed "immutable": Elastic Beanstalk starts the new version on fresh
#      instances, checks it is healthy, and only then moves traffic to it. If the new version is
#      unhealthy, the old one keeps serving and nobody notices.
#   4. After the switch, the live site is checked. If that check fails, the previous version is
#      deployed back automatically.
# If any step fails before the deployment, nothing in AWS has changed except the snapshot.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  EB_APPLICATION: Project-Module
  EB_ENVIRONMENT: Project-Module-env
  SITE_URL: https://ops.workeasy360.com

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: projectmodule_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests and type check
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc -b
          npx vitest run

      - name: Backend tests (real PostgreSQL)
        env:
          PROJECTMODULE_TEST_DB_URL: jdbc:postgresql://localhost:5432/projectmodule_test
          PROJECTMODULE_TEST_DB_USERNAME: postgres
          PROJECTMODULE_TEST_DB_PASSWORD: ci-only
        run: mvn -B -DskipFrontend=true test

  deploy:
    name: Deploy without downtime
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-north-1
      VERSION_LABEL: v${{ github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Build
        run: mvn -B clean package -DskipTests

      - name: Assemble the deployment bundle
        run: |
          rm -rf bundle bundle.zip
          mkdir bundle
          cp target/project-module-0.0.1-SNAPSHOT.jar bundle/application.jar
          cp -r deploy/. bundle/
          (cd bundle && zip -qr ../bundle.zip .)
          unzip -l bundle.zip

      - name: Check the environment is healthy (read only)
        run: |
          set -euo pipefail
          read -r STATUS HEALTH CURRENT <<<"$(aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION" --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].[Status,Health,VersionLabel]' --output text)"
          echo "Environment status: $STATUS, health: $HEALTH, running: $CURRENT"
          if [ "$STATUS" != "Ready" ]; then
            echo "::error::The environment is busy ($STATUS). Nothing was changed. Run this workflow again when it is Ready."
            exit 1
          fi
          echo "PREVIOUS_VERSION=$CURRENT" >> "$GITHUB_ENV"
          setting() {
            aws elasticbeanstalk describe-configuration-settings \
              --application-name "$EB_APPLICATION" --environment-name "$EB_ENVIRONMENT" \
              --query "ConfigurationSettings[0].OptionSettings[?Namespace=='$1' && OptionName=='$2'].Value | [0]" --output text
          }
          echo "Environment type: $(setting aws:elasticbeanstalk:environment EnvironmentType)"
          echo "Deployment policy: $(setting aws:elasticbeanstalk:command DeploymentPolicy)"
          HEALTH_SYSTEM="$(setting aws:elasticbeanstalk:healthreporting:system SystemType)"
          SERVICE_ROLE="$(setting aws:elasticbeanstalk:environment ServiceRole)"
          echo "Health reporting: $HEALTH_SYSTEM; service role: $SERVICE_ROLE"
          echo "HEALTH_SYSTEM=$HEALTH_SYSTEM" >> "$GITHUB_ENV"
          if [ "$HEALTH_SYSTEM" != "enhanced" ] && { [ -z "$SERVICE_ROLE" ] || [ "$SERVICE_ROLE" = "None" ]; }; then
            echo "::error::Enhanced health reporting (needed for a no-downtime deployment) needs the environment to have a service role, and it has none. Nothing was changed."
            exit 1
          fi
          DB_URL="$(setting aws:elasticbeanstalk:application:environment PROJECTMODULE_DB_URL)"
          if [ -z "$DB_URL" ] || [ "$DB_URL" = "None" ]; then
            DB_URL="$(setting aws:elasticbeanstalk:application:environment SPRING_DATASOURCE_URL)"
          fi
          echo "::add-mask::$DB_URL"
          DB_HOST="$(echo "$DB_URL" | sed -E 's#^jdbc:postgresql://([^:/]+).*#\1#')"
          echo "::add-mask::$DB_HOST"
          echo "DB_HOST=$DB_HOST" >> "$GITHUB_ENV"

      - name: Back up the production database
        run: |
          set -euo pipefail
          # Only harmless facts are printed: the repository is public, so its logs are too.
          if [ -z "$DB_HOST" ] || [ "$DB_HOST" = "None" ]; then
            echo "::error::The environment has no PROJECTMODULE_DB_URL or SPRING_DATASOURCE_URL to find the database by. Nothing was changed."
            exit 1
          fi
          HOST="$(echo "$DB_HOST" | tr '[:upper:]' '[:lower:]')"
          if ! echo "$HOST" | grep -qE '\.rds\.amazonaws\.com$'; then
            echo "::error::The database address is not an RDS endpoint, so it cannot be snapshotted here. Nothing was changed."
            exit 1
          fi
          DB_REGION="$(echo "$HOST" | sed -E 's#.*\.([a-z0-9-]+)\.rds\.amazonaws\.com$#\1#')"
          echo "Database region: $DB_REGION"
          STAMP="before-${{ github.run_number }}-${{ github.run_attempt }}-$(date -u +%Y%m%d%H%M)"

          INSTANCE="$(aws rds describe-db-instances --region "$DB_REGION" \
            --query "DBInstances[?Endpoint.Address=='$HOST'].DBInstanceIdentifier | [0]" --output text)"
          if [ -n "$INSTANCE" ] && [ "$INSTANCE" != "None" ]; then
            echo "Snapshotting the database instance as $STAMP"
            aws rds create-db-snapshot --region "$DB_REGION" --db-instance-identifier "$INSTANCE" \
              --db-snapshot-identifier "$STAMP" > /dev/null
            aws rds wait db-snapshot-available --region "$DB_REGION" --db-snapshot-identifier "$STAMP"
            echo "Backup ready: $STAMP"
            exit 0
          fi

          CLUSTER="$(aws rds describe-db-clusters --region "$DB_REGION" \
            --query "DBClusters[?Endpoint=='$HOST' || ReaderEndpoint=='$HOST'].DBClusterIdentifier | [0]" --output text 2>/dev/null || echo None)"
          if [ -n "$CLUSTER" ] && [ "$CLUSTER" != "None" ]; then
            echo "Snapshotting the database cluster as $STAMP"
            aws rds create-db-cluster-snapshot --region "$DB_REGION" --db-cluster-identifier "$CLUSTER" \
              --db-cluster-snapshot-identifier "$STAMP" > /dev/null
            aws rds wait db-cluster-snapshot-available --region "$DB_REGION" --db-cluster-snapshot-identifier "$STAMP"
            echo "Backup ready: $STAMP"
            exit 0
          fi

          COUNT="$(aws rds describe-db-instances --region "$DB_REGION" --query 'length(DBInstances)' --output text)"
          echo "::error::No database in $DB_REGION has the app's address ($COUNT database instance(s) visible to the deploy credentials). It may be in another AWS account. Nothing was changed."
          exit 1

      - name: Prepare a no-downtime deployment (enhanced health, immutable)
        run: |
          set -euo pipefail
          POLICY="$(aws elasticbeanstalk describe-configuration-settings \
            --application-name "$EB_APPLICATION" --environment-name "$EB_ENVIRONMENT" \
            --query "ConfigurationSettings[0].OptionSettings[?Namespace=='aws:elasticbeanstalk:command' && OptionName=='DeploymentPolicy'].Value | [0]" \
            --output text)"
          SETTINGS=()
          if [ "$HEALTH_SYSTEM" != "enhanced" ]; then
            echo "Turning on enhanced health reporting (one time)"
            SETTINGS+=("Namespace=aws:elasticbeanstalk:healthreporting:system,OptionName=SystemType,Value=enhanced")
          fi
          if [ "$POLICY" != "Immutable" ]; then
            echo "Switching the deployment policy from $POLICY to Immutable"
            SETTINGS+=("Namespace=aws:elasticbeanstalk:command,OptionName=DeploymentPolicy,Value=Immutable")
          fi
          if [ ${#SETTINGS[@]} -gt 0 ]; then
            aws elasticbeanstalk update-environment --environment-name "$EB_ENVIRONMENT" --option-settings "${SETTINGS[@]}" > /dev/null
            for i in $(seq 1 80); do
              read -r STATUS HEALTH <<<"$(aws elasticbeanstalk describe-environments --environment-names "$EB_ENVIRONMENT" \
                --query 'Environments[0].[Status,Health]' --output text)"
              echo "$(date -u +%H:%M:%S) status $STATUS, health $HEALTH"
              [ "$STATUS" = "Ready" ] && break
              sleep 15
            done
            NOW="$(aws elasticbeanstalk describe-configuration-settings \
              --application-name "$EB_APPLICATION" --environment-name "$EB_ENVIRONMENT" \
              --query "ConfigurationSettings[0].OptionSettings[?Namespace=='aws:elasticbeanstalk:healthreporting:system' && OptionName=='SystemType'].Value | [0]" \
              --output text)"
            if [ "$STATUS" != "Ready" ] || [ "$NOW" != "enhanced" ]; then
              echo "::error::Enhanced health could not be turned on (status $STATUS, health reporting $NOW). The new version was not deployed."
              aws elasticbeanstalk describe-events --environment-name "$EB_ENVIRONMENT" --max-items 15 \
                --query 'Events[].[EventDate,Severity,Message]' --output text || true
              exit 1
            fi
            # Give the health agent a moment to report before the deployment relies on it.
            sleep 60
          fi

      - name: Deploy the new version
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          BUCKET="$(aws elasticbeanstalk create-storage-location --query S3Bucket --output text)"
          KEY="$EB_APPLICATION/$VERSION_LABEL.zip"
          aws s3 cp bundle.zip "s3://$BUCKET/$KEY" --only-show-errors
          aws elasticbeanstalk create-application-version --application-name "$EB_APPLICATION" \
            --version-label "$VERSION_LABEL" --source-bundle "S3Bucket=$BUCKET,S3Key=$KEY" \
            --description "${{ github.sha }}" --process > /dev/null
          for i in $(seq 1 30); do
            STATE="$(aws elasticbeanstalk describe-application-versions --application-name "$EB_APPLICATION" \
              --version-labels "$VERSION_LABEL" --query 'ApplicationVersions[0].Status' --output text)"
            [ "$STATE" = "PROCESSED" ] && break
            if [ "$STATE" = "FAILED" ]; then echo "::error::The bundle was rejected. Nothing was deployed."; exit 1; fi
            sleep 5
          done
          echo "DEPLOY_STARTED=true" >> "$GITHUB_ENV"
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            # The assistant's key goes in with this same deployment, so it adds no extra restart.
            aws elasticbeanstalk update-environment --environment-name "$EB_ENVIRONMENT" --version-label "$VERSION_LABEL" \
              --option-settings "Namespace=aws:elasticbeanstalk:application:environment,OptionName=ANTHROPIC_API_KEY,Value=$ANTHROPIC_API_KEY" > /dev/null
          else
            aws elasticbeanstalk update-environment --environment-name "$EB_ENVIRONMENT" --version-label "$VERSION_LABEL" > /dev/null
          fi
          echo "Deploying $VERSION_LABEL. The current version keeps serving until the new one is healthy."
          for i in $(seq 1 120); do
            read -r STATUS HEALTH RUNNING <<<"$(aws elasticbeanstalk describe-environments \
              --environment-names "$EB_ENVIRONMENT" --query 'Environments[0].[Status,Health,VersionLabel]' --output text)"
            echo "$(date -u +%H:%M:%S) status $STATUS, health $HEALTH, running $RUNNING"
            [ "$STATUS" = "Ready" ] && break
            sleep 15
          done
          if [ "$RUNNING" != "$VERSION_LABEL" ]; then
            echo "::error::Elastic Beanstalk did not switch to the new version, so the previous one is still serving."
            aws elasticbeanstalk describe-events --environment-name "$EB_ENVIRONMENT" --max-items 15 \
              --query 'Events[].[EventDate,Severity,Message]' --output text || true
            exit 1
          fi

      - name: Check the live site
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "$SITE_URL/actuator/health" | grep -q '"UP"' \
              && curl -fsS --max-time 10 "$SITE_URL/" | grep -q '<title>WorkEasyProject</title>' \
              && curl -fsS --max-time 10 "$SITE_URL/api/v1/auth/config" | grep -q 'legacyHandover'; then
              echo "The new version is live and healthy."
              exit 0
            fi
            sleep 15
          done
          echo "::error::The live site did not pass its checks."
          exit 1

      - name: Put the previous version back
        if: failure() && env.DEPLOY_STARTED == 'true' && env.PREVIOUS_VERSION != ''
        run: |
          RUNNING="$(aws elasticbeanstalk describe-environments --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].VersionLabel' --output text)"
          if [ "$RUNNING" = "$PREVIOUS_VERSION" ]; then
            echo "The previous version $PREVIOUS_VERSION is still serving; nothing to put back."
            exit 0
          fi
          echo "Redeploying $PREVIOUS_VERSION"
          aws elasticbeanstalk update-environment --environment-name "$EB_ENVIRONMENT" --version-label "$PREVIOUS_VERSION" > /dev/null
          for i in $(seq 1 120); do
            STATUS="$(aws elasticbeanstalk describe-environments --environment-names "$EB_ENVIRONMENT" \
              --query 'Environments[0].Status' --output text)"
            [ "$STATUS" = "Ready" ] && break
            sleep 15
          done
          echo "Rolled back to $PREVIOUS_VERSION."
