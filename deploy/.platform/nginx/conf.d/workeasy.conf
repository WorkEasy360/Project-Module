# Added to Elastic Beanstalk's nginx (http block) by the deployment bundle.

# Task attachments may be up to 25 MB (spring.servlet.multipart in application.yml); nginx's own
# default of 1 MB would refuse them before they reach the application.
client_max_body_size 26M;

# The assistant can take about a minute to plan a large project. nginx's default 60 s would cut
# that answer off. Cloudflare in front allows 100 s.
proxy_read_timeout 120s;
proxy_send_timeout 120s;
